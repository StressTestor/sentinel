name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: AD-5 network-call lint
        run: bash scripts/ad5-network-lint.sh
      - name: locked all-target all-feature tests
        run: cargo test --locked --all-targets --all-features --verbose
      - name: locked all-target all-feature clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: build verifier binary
        run: cargo build --locked --all-features --bin sentinel
      - name: bundled attack regression gate
        run: |
          verify_home="$RUNNER_TEMP/sentinel-verify-home"
          mkdir -p "$verify_home"
          HOME="$verify_home" target/debug/sentinel verify
      - name: public documentation assertions
        run: bash scripts/docs-claims-check.sh target/debug/sentinel

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: minimum supported Rust
        run: cargo check --locked --all-targets --all-features

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: packaged-source install and command smoke
        env:
          SENTINEL_EXPECTED_VCS_SHA: ${{ github.sha }}
        run: bash scripts/package-smoke.sh

  platform:
    name: platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: native all-target all-feature tests
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --locked --all-targets --all-features --verbose
      - name: native release build
        run: cargo build --release --locked --all-features
      - name: native binary smoke
        run: target/release/sentinel --version
