name: deps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: RustSec advisory audit
        run: cargo audit --deny warnings

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # on PRs, judge the PR's deps with the BASE branch's policy so a PR
      # can't allowlist its own bad dependency by editing deny.toml in the
      # same change. falls back to the PR's copy only while the base branch
      # has no deny.toml yet (bootstrap).
      - name: pin deny.toml to base ref on PRs
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          if git cat-file -e "origin/$GITHUB_BASE_REF:deny.toml" 2>/dev/null; then
            git checkout "origin/$GITHUB_BASE_REF" -- deny.toml
          fi
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
