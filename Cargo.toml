[package]
name = "sentinel-guard"
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
description = "runtime defense for CLI AI agents: intercepts tool calls before execution and enforces security policy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/StressTestor/sentinel"
homepage = "https://stresstestor.github.io/sentinel/"
documentation = "https://github.com/StressTestor/sentinel#readme"
readme = "README.md"
keywords = ["security", "llm", "agent", "prompt-injection", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "/src/**",
  "/tests/**",
  "/assets/**",
  "/corpus/**",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/LICENSE-*",
]

[[bin]]
name = "sentinel"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
toml_edit = "0.25"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
colored = "3"
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
unicode-normalization = "0.1"
html-escape = "0.2"
getrandom = "0.4"
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1
